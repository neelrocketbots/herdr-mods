<!doctype html>
<html><head><meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { width: 1600px; height: 800px; background: #efe8db; color: #2b2823; font-family: -apple-system, "SF Pro Text", "Helvetica Neue", sans-serif; -webkit-font-smoothing: antialiased; display: flex; overflow: hidden; }
  .text { width: 560px; flex: none; padding: 80px 0 72px 80px; display: flex; flex-direction: column; }
  .kind { font-size: 15px; letter-spacing: .12em; color: #7a7266; font-weight: 600; }
  h1 { font: 700 72px/1.05 "Avenir Next", -apple-system, sans-serif; letter-spacing: -0.02em; margin: 26px 0 26px; white-space: nowrap; }
  .tag { font-size: 25px; line-height: 1.45; color: #4a453d; }
  ul { list-style: none; margin-top: 34px; display: flex; flex-direction: column; gap: 14px; font-size: 20px; color: #3a362f; }
  li::before { content: "→ "; color: #6a7d3f; }
  .install { margin-top: auto; background: #1d1c1a; color: #e9e6df; font: 15.5px/1.65 "SF Mono", Menlo, monospace; padding: 18px 20px; white-space: pre; }
  .stage { flex: 1; position: relative; }
  .stage iframe { position: absolute; border: 0; background: transparent; transform-origin: top left; filter: drop-shadow(0 28px 50px rgba(40,30,15,.28)); }
</style></head>
<body>
<div class="text"><div class="kind" id="kind">HERDR MOD</div><h1 id="title"></h1><div class="tag" id="tag"></div><ul id="bullets"></ul><div class="install" id="install"></div></div>
<div class="stage"><iframe id="mock" scrolling="no"></iframe></div>
<script>
const UNITS = {
  "quick-links": { tag: "GitHub, PR, CI and Linear for the focused terminal, in the top bar.",
    bullets: ["Repo, branch PR and a CI dot", "PRs in other repos that name the issue", "Linear issue with its status, worktree, editor"],
    page: "topbar.html", w: 920, h: 200, scale: 1.0, x: 60, y: 300 },
  "issue-worktree": { tag: "One git worktree per issue, made and cleaned up from one dialog.",
    bullets: ["Name it after the issue, opens a space", "PR state and CI for every worktree", "Rename, remove, open in your editor"],
    page: "worktree.html", w: 568, h: 620, scale: 1.12, x: 200, y: 60 },
  "pr-inbox": { tag: "Pull requests waiting on you, and yours, in a side panel.",
    bullets: ["Review state, conflicts, CI and age", "Click: your space for it, else GitHub", "Bots and stale PRs fold away"],
    page: "prinbox.html", w: 440, h: 510, scale: 1.3, x: 230, y: 60 },
  "files-md": { tag: "Herdr's Files panel, with markdown rendered.",
    bullets: ["Preview and Source for .md files", "Syntax highlighting for the rest", "Open the file in your editor"],
    page: "files.html", w: 488, h: 524, scale: 1.25, x: 230, y: 60 },
  "changes-editor": { tag: "Herdr's Changes panel, one click from your editor.",
    bullets: ["Changed files and their diffs", "Open the selected file in your editor", "Commit from the panel, as before"],
    page: "changes.html", w: 460, h: 510, scale: 1.3, x: 220, y: 60 },
  "custom-herdr": { kind: "HERDR LAYOUT", tag: "Herdr's main layout with the whole worktree-per-issue kit wired in.",
    bullets: ["Quick links in the top bar", "Files, Changes and PRs side panels", "Worktree dialog on ⌘⌥N, PR inbox on ⌘⌥P"],
    page: "overview.html", w: 1400, h: 820, scale: 0.68, x: 40, y: 120 },
};
const unit = new URLSearchParams(location.search).get("unit"), u = UNITS[unit];
document.getElementById("kind").textContent = u.kind ?? "HERDR MOD";
const title = document.getElementById("title");
title.textContent = unit;
for (let size = 72; title.scrollWidth > 480 && size > 40; size -= 2) title.style.fontSize = size + "px";
document.getElementById("tag").textContent = u.tag;
document.getElementById("bullets").innerHTML = u.bullets.map((b) => `<li>${b}</li>`).join("");
const what = u.kind ? "layout" : "mod", where = u.kind ? "layouts" : "mods";
document.getElementById("install").textContent = `Read ~/.config/herdr-app/AGENTS.md,\nthen add this ${what}:\nherdr.dev/${where}/neelrocketbots/${unit}`;
const f = document.getElementById("mock");
Object.assign(f.style, { width: u.w + "px", height: u.h + "px", left: u.x + "px", top: u.y + "px", transform: `scale(${u.scale})` });
f.src = u.page;
</script>
</body></html>
