<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="style.css">
<style>
  .panel { width: 268px; background: var(--chrome); border: 1px solid var(--border); border-radius: 10px; padding: 8px 10px; gap: 2px; }
  .kbd { flex: none; height: 14px; padding: 0 3px; display: inline-flex; align-items: center; border: 1px solid var(--border); border-radius: 3px; font-size: 9.5px; color: var(--dim); }
  .space .grow + .kbd, .space .branch + .kbd { margin-left: 8px; }
  .agent { white-space: nowrap; }
  .agent .ago { margin-left: auto; }
  .sec { font-size: 11px; padding: 8px 8px 4px; }
  .st { width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid var(--dim); flex: none; margin-left: 8px; }
  .spin { border-color: var(--yellow); border-right-color: transparent; }
</style></head>
<body style="padding:20px">
<div class="panel col">
  <div class="label">Agents</div>
  <div class="sec" style="color:var(--yellow)">Working 2</div>
  <div class="agent row" style=""><i data-i="claude" style="color:var(--orange)"></i>WEB-131<span class="dim trunc">· chart tooltips</span><span class="ago">1m</span><span class="kbd" style="margin-left:8px">⌘[</span><span class="st spin"></span></div>
  <div class="agent row on" style="background:var(--raised)"><i data-i="claude" style="color:var(--orange)"></i>WEB-128<span class="dim trunc">· invoice export</span><span class="ago">2m</span><span class="st spin"></span></div>
  <div class="sec dim">Idle 2</div>
  <div class="agent row" style=""><i data-i="claude" style="color:var(--orange)"></i>api<span class="dim trunc">· rate limits</span><span class="ago">31m</span><span class="kbd" style="margin-left:8px">⌘]</span><span class="st "></span></div>
  <div class="agent row" style=""><i data-i="claude" style="color:var(--orange)"></i>docs<span class="dim trunc">· changelog</span><span class="ago">1h</span><span class="st "></span></div>
</div>
<script src="icons.js"></script>
</body></html>
