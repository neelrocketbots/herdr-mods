<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="style.css"></head>
<body style="padding:20px">
<div class="col" style="width:880px;align-items:flex-end;gap:10px">
  <div class="dialog" style="width:340px;padding:12px 14px;font-size:12px;box-shadow:none">
    <div style="color:var(--fg)">draft: Add invoice export to billing</div>
    <div class="dim" style="margin-top:4px">CI failing: Unit tests · click opens the failing run</div>
  </div>
  <div class="topbar row" style="width:880px;border:1px solid var(--border);border-radius:10px;justify-content:flex-end">
    <div class="btn row"><i data-i="file"></i>Files</div>
    <div class="btn row"><i data-i="changes"></i>Changes</div>
    <div class="btn row"><i data-i="pr"></i>PRs<span class="count">3</span></div>
    <div class="sep"></div>
    <div class="btn row"><i data-i="github"></i>web-app</div>
    <div class="btn row on"><i data-i="pr" style="color:var(--dim)"></i>#482<span class="dot red" style="width:6px;height:6px"></span></div>
    <div class="btn row"><i data-i="pr" style="color:var(--green)"></i>ui#91<span class="dot green" style="width:6px;height:6px"></span></div>
    <div class="btn row"><i data-i="linear" style="color:#0f9d58"></i>WEB-128 · In Review</div>
    <div class="btn row"><i data-i="worktree"></i>Worktree</div>
    <div class="btn row"><i data-i="editor"></i>Zed</div>
  </div>
</div>
<script src="icons.js"></script>
</body></html>
