<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="style.css">
<style>
  .usage { width: 268px; background: var(--chrome); border: 1px solid var(--border); border-radius: 10px; padding: 8px 10px 6px; gap: 2px; }
  .acct { padding: 4px 8px; gap: 3px; border-radius: 7px; font-size: 12.5px; }
  .gs { gap: 10px; font-size: 11px; }
  .g { gap: 4px; flex: 1; min-width: 0; } .g > span { flex: none; }
  .g > .tr { flex: 1; min-width: 12px; } .tr { height: 3px; border-radius: 2px; background: var(--input); overflow: hidden; display: inline-flex; }
  .tr span { height: 100%; border-radius: 2px; }
  svg.s { width: 14px; height: 14px; flex: none; }
</style></head>
<body style="padding:20px">
<div class="usage col">
  <div class="label" style="padding:2px 8px 4px">Usage</div>
  <div class="acct col"><div class="row" style="gap:8px"><i data-i="claude" style="color:var(--orange)"></i><span>Claude</span></div><div class="gs row"><span class="g row"><span class="dim">5h</span><span class="tr"><span style="width:63%;background:var(--yellow)"></span></span><span style="color:var(--yellow)">63%</span><span class="dim">3h</span></span><span class="g row"><span class="dim">7d</span><span class="tr"><span style="width:41%;background:var(--green)"></span></span><span style="color:var(--green)">41%</span><span class="dim">3d</span></span><span class="g row"><span class="dim">fbl</span><span class="tr"><span style="width:84%;background:var(--red)"></span></span><span style="color:var(--red)">84%</span></span></div></div>
  <div class="acct col"><div class="row" style="gap:8px"><i data-i="claude" style="color:var(--orange)"></i><span>Claude 2</span></div><div class="gs row"><span class="g row"><span class="dim">5h</span><span class="tr"><span style="width:9%;background:var(--green)"></span></span><span style="color:var(--green)">9%</span><span class="dim">4h</span></span><span class="g row"><span class="dim">7d</span><span class="tr"><span style="width:12%;background:var(--green)"></span></span><span style="color:var(--green)">12%</span><span class="dim">5d</span></span><span class="g row"><span class="dim">fbl</span><span class="tr"><span style="width:3%;background:var(--green)"></span></span><span style="color:var(--green)">3%</span></span></div></div>
  <div class="acct col"><div class="row" style="gap:8px"><svg class="s" viewBox="0 0 24 24"><rect width="24" height="24" rx="5" fill="#fff"/><path d="M7 9l3 3-3 3M12 15h5" stroke="#111" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Codex</span></div><div class="gs row"><span class="g row"><span class="dim">5h</span><span class="tr"><span style="width:52%;background:var(--yellow)"></span></span><span style="color:var(--yellow)">52%</span><span class="dim">47m</span></span><span class="g row"><span class="dim">7d</span><span class="tr"><span style="width:25%;background:var(--green)"></span></span><span style="color:var(--green)">25%</span><span class="dim">6d</span></span></div></div>
</div>
<script src="icons.js"></script>
</body></html>
