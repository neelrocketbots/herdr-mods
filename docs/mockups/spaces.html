<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="style.css">
<style>
  .panel { width: 268px; background: var(--chrome); border: 1px solid var(--border); border-radius: 10px; padding: 8px 10px; gap: 2px; }
  .kbd { flex: none; height: 14px; padding: 0 3px; display: inline-flex; align-items: center; border: 1px solid var(--border); border-radius: 3px; font-size: 9.5px; color: var(--dim); }
  .space .grow + .kbd, .space .branch + .kbd { margin-left: 8px; }
  .agent { white-space: nowrap; }
  .agent .ago { margin-left: auto; }
  .sec { font-size: 11px; padding: 8px 8px 4px; }
  .st { width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid var(--dim); flex: none; margin-left: 8px; }
  .spin { border-color: var(--yellow); border-right-color: transparent; }
</style></head>
<body style="padding:20px">
<div class="panel col">
  <div class="label">Spaces</div>
  <div class="space row"><span class="badge" style="background:#e0a85a">W</span>web-app<span class="grow"></span><span class="kbd">⌃1</span></div>
  <div class="space row sub on"><i data-i="worktree" style="color:var(--dim)"></i>WEB-128<span class="branch dim">feat/invoice-csv</span><span class="kbd">⌃2</span></div>
  <div class="space row sub"><i data-i="worktree" style="color:var(--dim)"></i>WEB-131<span class="branch dim">WEB-131</span><span class="kbd">⌃3</span></div>
  <div class="space row"><span class="badge" style="background:#6fbf73">A</span>api<span class="grow"></span><span class="dim" style="font-size:11.5px;color:var(--green)">↑2</span><span class="kbd">⌃4</span></div>
  <div class="space row"><span class="badge" style="background:#8fb3e8">D</span>docs<span class="grow"></span><span class="kbd">⌃5</span></div>
</div>
<script src="icons.js"></script>
</body></html>
