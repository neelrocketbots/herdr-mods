  <rect x="228" y="8" width="18" height="7" rx="2" fill="#3a3d43"/>
  <rect x="250" y="8" width="13" height="7" rx="2" fill="#3a3d43"/>
  <circle cx="266" cy="11.5" r="2" fill="#6fbf73"/>
